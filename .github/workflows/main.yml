name: Main
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby in Docker

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ruby-test -f Dockerfile .

      - name: Run tests in Docker (detached)
        run: |
          docker run -d \
            --name ruby-test-container \
            -w /app \
            ruby-test \
            bash -c "bundle exec rspec --require spec_helper && sleep 1"

      - name: Copy coverage.json out of container
        run: |
          mkdir -p tmp_coverage
          docker cp ruby-test-container:/app/coverage/coverage.json tmp_coverage/coverage.json
          mv tmp_coverage/coverage.json coverage/coverage.json

      - name: Cleanup container
        run: docker rm ruby-test-container

      - name: Check coverage file exists
        run: test -f coverage/coverage.json

      - uses: qltysh/qlty-action/coverage@v1
        with:
          oidc: true
          files: coverage/coverage.json
